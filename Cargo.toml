[package]
name = "meetlite"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A lightweight local meeting recorder and remote transcription CLI"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.15"
crossbeam-channel = "0.5"
ctrlc = "3"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
keyring = { version = "4.2", features = ["v1"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-native-roots"] }
rpassword = "7"
tempfile = "3"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"
eframe = { version = "=0.36.2", default-features = false, features = ["x11", "wayland"] }
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
