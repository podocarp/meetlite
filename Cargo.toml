[package]
name = "meetlite"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A lightweight local meeting recorder and remote transcription CLI"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.15"
crossbeam-channel = "0.5"
ctrlc = "3"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
