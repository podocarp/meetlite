<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Meetlite</title>
  <desc id="desc">Meetlite logo banner with audio waveform and microphone mark</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="32" fill="url(#background)"/>
  <circle cx="1020" cy="72" r="160" fill="#22d3ee" opacity="0.1"/>
  <circle cx="106" cy="264" r="142" fill="#34d399" opacity="0.09"/>
  <g transform="translate(86 74)">
    <rect x="52" y="0" width="86" height="134" rx="43" fill="none" stroke="#e5f7fb" stroke-width="15"/>
    <path d="M28 88c0 42 30 76 67 76s67-34 67-76" fill="none" stroke="#67e8f9" stroke-width="15" stroke-linecap="round"/>
    <path d="M95 164v39M55 203h80" fill="none" stroke="#e5f7fb" stroke-width="15" stroke-linecap="round"/>
    <path d="M95 28v78" fill="none" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  </g>
  <path d="M286 166c28 0 28-72 56-72s28 126 56 126 28-96 56-96 28 48 56 48 28-88 56-88 28 126 56 126 28-62 56-62 28 36 56 36 28-96 56-96 28 128 56 128 28-68 56-68 28 34 56 34" fill="none" stroke="url(#wave)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="286" y="114" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">Meetlite</text>
  <text x="290" y="258" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="500">Local meeting recording for macOS and Debian Linux</text>
</svg>
