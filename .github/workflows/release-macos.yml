name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-capture-agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: aarch64
            uname_architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            uname_architecture: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MEETLITE_MANIFEST_SIGNING_KEY: ${{ secrets.MEETLITE_MANIFEST_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname_architecture }}"
      - name: Require manifest signing secret
        run: |
          test -n "$MEETLITE_MANIFEST_SIGNING_KEY"
      - name: Build ad-hoc signed apps
        run: nix develop --command bash scripts/build-macos-app.sh
      - name: Package ad-hoc capture agent and sign manifest
        env:
          TAG: ${{ github.ref_name }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          nix develop --command bash <<'BASH'
          set -euo pipefail
          CLI_ARCHIVE="meetlite-macos-$ARCHITECTURE.zip"
          AGENT_ARCHIVE="MeetliteCapture-macos-$ARCHITECTURE.app.zip"
          MANIFEST="MeetliteCapture-macos-$ARCHITECTURE.manifest.json"
          ditto -c -k --sequesterRsrc dist/meetlite "$CLI_ARCHIVE"
          ditto -c -k --sequesterRsrc --keepParent dist/MeetliteCapture.app "$AGENT_ARCHIVE"
          ARCHIVE_SHA256="$(shasum -a 256 "$AGENT_ARCHIVE" | cut -d ' ' -f 1)"
          ARCHIVE_URL="https://github.com/podocarp/meetlite/releases/download/$TAG/$AGENT_ARCHIVE"
          export TAG ARCHIVE_SHA256 ARCHIVE_URL MANIFEST
          python3 - <<'PY'
          import base64
          import json
          import os
          from cryptography.hazmat.primitives import serialization

          manifest = {
              "version": os.environ["TAG"],
              "archive_url": os.environ["ARCHIVE_URL"],
              "archive_sha256": os.environ["ARCHIVE_SHA256"],
          }
          key = serialization.load_pem_private_key(
              base64.b64decode(os.environ["MEETLITE_MANIFEST_SIGNING_KEY"]), password=None
          )
          payload = "version={version}\narchive_url={archive_url}\narchive_sha256={archive_sha256}\n".format(**manifest).encode()
          manifest["signature"] = base64.b64encode(key.sign(payload)).decode()
          with open(os.environ["MANIFEST"], "w", encoding="ascii") as output:
              json.dump(manifest, output, separators=(",", ":"), sort_keys=True)
              output.write("\n")
          PY
          BASH
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          nix develop --command bash <<'BASH'
          set -euo pipefail
          for _ in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            gh release create "$TAG" --generate-notes >/dev/null 2>&1 || true
            sleep 2
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" --clobber \
           "meetlite-macos-$ARCHITECTURE.zip" \
           "MeetliteCapture-macos-$ARCHITECTURE.app.zip" \
           "MeetliteCapture-macos-$ARCHITECTURE.manifest.json"
          BASH
