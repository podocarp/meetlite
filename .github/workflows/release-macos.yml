name: Release macOS capture agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-capture-agent:
    runs-on: macos-14
    env:
      MEETLITE_MANIFEST_SIGNING_KEY: ${{ secrets.MEETLITE_MANIFEST_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require manifest signing secret
        run: |
          test -n "$MEETLITE_MANIFEST_SIGNING_KEY"
      - name: Build ad-hoc signed apps
        run: bash scripts/build-macos-app.sh
      - name: Install manifest signer
        run: |
          python3 -m venv "$RUNNER_TEMP/manifest-signer"
          "$RUNNER_TEMP/manifest-signer/bin/pip" install --disable-pip-version-check 'cryptography==45.0.6'
      - name: Package ad-hoc capture agent and sign manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/MeetliteCapture.app MeetliteCapture.app.zip
          ARCHIVE_SHA256="$(shasum -a 256 MeetliteCapture.app.zip | cut -d ' ' -f 1)"
          ARCHIVE_URL="https://github.com/podocarp/meetlite/releases/download/$TAG/MeetliteCapture.app.zip"
          export TAG ARCHIVE_SHA256 ARCHIVE_URL
          "$RUNNER_TEMP/manifest-signer/bin/python" - <<'PY'
          import base64
          import json
          import os
          from cryptography.hazmat.primitives import serialization

          manifest = {
              "version": os.environ["TAG"],
              "archive_url": os.environ["ARCHIVE_URL"],
              "archive_sha256": os.environ["ARCHIVE_SHA256"],
          }
          key = serialization.load_pem_private_key(
              base64.b64decode(os.environ["MEETLITE_MANIFEST_SIGNING_KEY"]), password=None
          )
          payload = "version={version}\narchive_url={archive_url}\narchive_sha256={archive_sha256}\n".format(**manifest).encode()
          manifest["signature"] = base64.b64encode(key.sign(payload)).decode()
          with open("MeetliteCapture.manifest.json", "w", encoding="ascii") as output:
              json.dump(manifest, output, separators=(",", ":"), sort_keys=True)
              output.write("\n")
          PY
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes MeetliteCapture.app.zip MeetliteCapture.manifest.json
